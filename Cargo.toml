[workspace]
members = [
    "atlas-core",
    "atlas-scheme",
    "atlas-gate",
    "atlas-registry",
    "atlas-logic/atlas-auth",
    "atlas-logic/atlas-blitz",
    "atlas-logic/atlas_holdem",
    "atlas-toolkit/atlas-db-migration",
    "atlas-toolkit/atlas-client-cli",
    "atlas-toolkit/atlas-codegen"
]
resolver = "3"

[workspace.dependencies]
# local
atlas-core = { path = "atlas-core" }
atlas-scheme = { path = "atlas-scheme" }

# runtime
tokio = "1.48"

# network
axum = "0.8"
tokio-util = "0.7"
futures = "0.3"
futures-util = "0.3"

# database
sea-orm = "1.1.19"
sea-orm-cli = "1.1.19"
sea-orm-migration = "1.1.19"

# common
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
serde = "1.0"
rmp-serde = "1.3.0"
bytes = "1.11"
parking_lot = "0.12"
slab = "0.4"
clap = "4.5"
ulid = "1.2"
chrono = "0.4"
dashmap = "6.1.0"

# client common
reqwest = "0.13"
tokio-tungstenite = "0.28"
